name: Автопроверки

# Гоняется на каждый пуш в dev и main и вручную (Actions → Автопроверки → Run workflow).
# Две job'ы: быстрая без браузера и полная с Playwright.
# Любая упавшая проверка роняет job — красный крестик виден прямо в PR/коммите.
on:
  push:
    branches: [ main, dev ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. ЯДРО: сборка из parts/*, экономика, сюжет, 90 дней в заглушках DOM.
  # Браузер не нужен — 20 секунд, поэтому стоит первым и в PR.
  core:
    name: ядро и сборка (без браузера)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Зависимостей нет — проверяем, что это правда
        run: node -e "console.log('node', process.version)"

      - name: Автопроверки без браузера
        run: node tools/run_all.js --no-browser

  # 2. БРАУЗЕР: Playwright гоняет сцену, интерфейс, сохранения, таймеры.
  # Ставим обычный playwright: tools/browser.js сам выбирает его, если нет
  # песочного комплекта playwright-core + @sparticuz/chromium.
  browser:
    name: сцена и интерфейс (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Поставить playwright и chromium с системными библиотеками
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm i --no-audit --no-fund --no-save playwright@latest
          npx playwright install --with-deps chromium

      - name: Быстрый набор с браузером
        run: node tools/run_all.js --browser-only --fast

      - name: Скриншоты провалов (если что-то упало)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: shots
          path: shots/
          if-no-files-found: ignore
          retention-days: 7
