name: Deploy to GitHub Pages

on:
  push:
    branches:
      - dev
      - agent/greensim-p0-stabilization
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Сборка и проверка index.html из parts/*
        run: |
          test -s index.html
          bash build.sh
          if ! git diff --quiet -- index.html; then
            echo "::error::index.html не совпадает со сборкой из parts/*"
            git diff --stat -- index.html
            exit 1
          fi

      - name: Автотесты экономики, кампании и безопасности
        run: |
          node test6_economy.js
          node test7_story.js
          node test8_security.js

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
