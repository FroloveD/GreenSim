name: Deploy to GitHub Pages

on:
  push:
    branches:
      - dev
      - agent/greensim-p0-stabilization
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Проверка сборки из parts (ветка dev)
        if: github.ref_name == 'dev'
        run: |
          test -s index.html
          bash build.sh
          if ! git diff --quiet -- index.html; then
            echo "::error::index.html не совпадает со сборкой из parts/*"
            git diff --stat -- index.html
            exit 1
          fi

      - name: Проверка index.html (ветка стабилизации)
        if: github.ref_name == 'agent/greensim-p0-stabilization'
        run: |
          node -e '
          const fs = require("fs");
          const s = fs.readFileSync("index.html", "utf8");
          if (!s.trim()) throw new Error("index.html пуст");
          const start = s.indexOf("<script>");
          const end = s.lastIndexOf("</script>");
          if (start < 0 || end <= start) throw new Error("Основной script не найден");
          new Function(s.slice(start + 8, end));
          console.log("index.html проверен: " + s.length + " символов");
          '

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
