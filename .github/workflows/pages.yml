name: Deploy to GitHub Pages
# публикуем с ветки dev — так решил хозяин проекта (см. docs/checks.md)

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# не отменяем уже начавшуюся публикацию: прерванный деплой оставляет
# артефакт github-pages «висящим» и следующий запуск падает на дубликате
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 1. СБОРКА: проверяем, что index.html собран из parts/* и не пустой
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Проверка сборки (index.html соответствует parts/*)
        run: |
          test -s index.html
          echo "index.html: $(wc -c < index.html) байт"
          bash build.sh
          if ! git diff --quiet -- index.html; then
            echo "::error::index.html в репозитории не совпадает со сборкой из parts/*. Запустите ./build.sh локально и закоммитьте."
            git diff --stat -- index.html
            exit 1
          fi
          echo "сборка синхронна с parts/*"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

  # 2. ПУБЛИКАЦИЯ: отдельная job — артефакт к этому моменту уже проиндексирован
  #    (в одной job'е deploy-pages иногда не видит свежий артефакт, см. actions/deploy-pages#451)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
